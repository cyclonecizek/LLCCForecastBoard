name: Update LLCC board

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: llcc-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install
        run: |
          sudo apt-get install -y --no-install-recommends libeccodes-dev
          pip install -r requirements.txt
      - name: Build board
        run: python -m pipeline.run
      - name: Commit data
        run: |
          git config user.name  "llcc-bot"
          git config user.email "llcc-bot@users.noreply.github.com"
          git add docs/data/board.json cache/
          git diff --cached --quiet && exit 0
          git commit -m "llcc $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1

  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          sudo apt-get install -y --no-install-recommends libeccodes-dev
          pip install -r requirements.txt
      - run: python -m pipeline.probe
